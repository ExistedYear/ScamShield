<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#08080c"/>
      <stop offset="55%" stop-color="#0d0d16"/>
      <stop offset="100%" stop-color="#141026"/>
    </linearGradient>
    <radialGradient id="g1" cx="18%" cy="8%" r="62%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity=".30"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="88%" cy="6%" r="60%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fafafa"/>
      <stop offset="100%" stop-color="#c7d2fe"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <filter id="card" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="22" flood-color="#000" flood-opacity=".55"/>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect width="1280" height="720" fill="url(#g1)"/>
  <rect width="1280" height="720" fill="url(#g2)"/>

  <!-- faint grid -->
  <g opacity=".05" stroke="#ffffff" stroke-width="1">
    <path d="M0 140H1280M0 300H1280M0 460H1280M0 620H1280"/>
    <path d="M180 0V720M420 0V720M660 0V720M900 0V720M1140 0V720"/>
  </g>

  <!-- logo -->
  <g transform="translate(78 62)">
    <rect x="0" y="0" width="52" height="52" rx="14" fill="url(#brand)"/>
    <path d="M26 12 L38 17 V27 C38 34 32.5 39.4 26 41.5 C19.5 39.4 14 34 14 27 V17 Z"
          fill="#0b0b12" opacity=".92"/>
    <rect x="22" y="23" width="8" height="11" rx="2" fill="#0b0b12" opacity=".55"/>
  </g>
  <text x="146" y="90" font-family="Noto Sans,DejaVu Sans,sans-serif" font-size="27" font-weight="700" fill="#fafafa">Scam<tspan fill="#818cf8">Shield</tspan></text>
  <text x="146" y="112" font-family="Noto Sans,DejaVu Sans,sans-serif" font-size="14" fill="#a1a1aa">Multilingual Smishing Detection</text>

  <!-- headline -->
  <text x="78" y="204" font-family="Noto Sans,DejaVu Sans,sans-serif" font-size="58" font-weight="800" fill="url(#hero)" letter-spacing="-1.6">Catch the scam</text>
  <text x="78" y="268" font-family="Noto Sans,DejaVu Sans,sans-serif" font-size="58" font-weight="800" fill="url(#hero)" letter-spacing="-1.6">
    <tspan fill="#6b6b76">before </tspan><tspan fill="url(#brand)">it catches you</tspan>
  </text>
  <text x="78" y="312" font-family="Noto Sans,DejaVu Sans,sans-serif" font-size="20" fill="#a1a1aa">English · Hindi · Hinglish — with word-level evidence for every verdict</text>

  <!-- chips -->
  <g font-family="Noto Sans,DejaVu Sans,sans-serif" font-size="14" font-weight="700">
    <g transform="translate(78 348)">
      <rect width="150" height="34" rx="17" fill="#34d399" fill-opacity=".14" stroke="#34d399" stroke-opacity=".38"/>
      <text x="75" y="23" fill="#34d399" text-anchor="middle">XLM-RoBERTa</text>
    </g>
    <g transform="translate(240 348)">
      <rect width="118" height="34" rx="17" fill="#818cf8" fill-opacity=".14" stroke="#818cf8" stroke-opacity=".38"/>
      <text x="59" y="23" fill="#a5b4fc" text-anchor="middle">SHAP XAI</text>
    </g>
    <g transform="translate(370 348)">
      <rect width="176" height="34" rx="17" fill="#c084fc" fill-opacity=".14" stroke="#c084fc" stroke-opacity=".38"/>
      <text x="88" y="23" fill="#d8b4fe" text-anchor="middle">Safe Browsing</text>
    </g>
    <g transform="translate(558 348)">
      <rect width="124" height="34" rx="17" fill="#fafafa" fill-opacity=".07" stroke="#ffffff" stroke-opacity=".16"/>
      <text x="62" y="23" fill="#a1a1aa" text-anchor="middle">Android</text>
    </g>
  </g>

  <!-- SMS card -->
  <g filter="url(#card)">
    <rect x="78" y="420" width="620" height="196" rx="20" fill="#1a1a26" fill-opacity=".92" stroke="#ffffff" stroke-opacity=".12"/>
  </g>
  <text x="106" y="456" font-family="Noto Sans,DejaVu Sans,sans-serif" font-size="12" font-weight="700" fill="#6b6b76" letter-spacing="1.6">SUSPECTED SMS</text>
  <text x="106" y="490" font-family="Noto Sans,DejaVu Sans,sans-serif" font-size="17" fill="#d4d4d8">URGENT: Your SBI account has been suspended.</text>
  <text x="106" y="518" font-family="Noto Sans,DejaVu Sans,sans-serif" font-size="17" fill="#d4d4d8">Verify KYC now at http://sbi-kyc-verify.xyz</text>

  <g transform="translate(106 546)">
    <rect width="96" height="30" rx="15" fill="#fb7185" fill-opacity=".16" stroke="#fb7185" stroke-opacity=".42"/>
    <circle cx="20" cy="15" r="4.5" fill="#fb7185"/>
    <text x="62" y="20" font-family="Noto Sans,DejaVu Sans,sans-serif" font-size="12.5" font-weight="700" fill="#fb7185" text-anchor="middle">SCAM</text>
    <rect x="108" width="112" height="30" rx="15" fill="#fbbf24" fill-opacity=".14" stroke="#fbbf24" stroke-opacity=".40"/>
    <text x="164" y="20" font-family="Noto Sans,DejaVu Sans,sans-serif" font-size="12.5" font-weight="700" fill="#fbbf24" text-anchor="middle">suspicious TLD</text>
    <rect x="232" width="150" height="30" rx="15" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".14"/>
    <text x="307" y="20" font-family="Noto Sans,DejaVu Sans,sans-serif" font-size="12.5" font-weight="700" fill="#a1a1aa" text-anchor="middle">urgency ×4</text>
  </g>

  <!-- confidence bar -->
  <text x="106" y="602" font-family="Noto Sans,DejaVu Sans,sans-serif" font-size="11" fill="#6b6b76" letter-spacing="1.2">THREAT CONFIDENCE</text>
  <rect x="244" y="592" width="424" height="10" rx="5" fill="#ffffff" fill-opacity=".08"/>
  <rect x="244" y="592" width="380" height="10" rx="5" fill="#fb7185"/>
  <rect x="466" y="586" width="2" height="22" fill="#fafafa" fill-opacity=".55"/>

  <!-- verdict card -->
  <g filter="url(#card)">
    <rect x="738" y="420" width="464" height="196" rx="20" fill="#1a1520" stroke="#fb7185" stroke-opacity=".34"/>
  </g>
  <rect x="738" y="420" width="4" height="196" rx="2" fill="#fb7185"/>
  <circle cx="800" cy="480" r="26" fill="#fb7185" fill-opacity=".14" stroke="#fb7185" stroke-opacity=".40"/>
  <path d="M800 466 L810 486 H790 Z" fill="#fb7185"/>
  <rect x="795" y="474" width="10" height="2.6" rx="1.3" fill="#1a1520"/>
  <circle cx="800" cy="481.5" r="1.5" fill="#1a1520"/>
  <text x="842" y="474" font-family="Noto Sans,DejaVu Sans,sans-serif" font-size="23" font-weight="800" fill="#fafafa">Scam detected</text>
  <text x="842" y="500" font-family="Noto Sans,DejaVu Sans,sans-serif" font-size="14.5" fill="#a1a1aa">High risk · <tspan fill="#fafafa" font-weight="600">spam</tspan> · english</text>
  <text x="1152" y="482" font-family="Noto Sans,DejaVu Sans,sans-serif" font-size="44" font-weight="900" fill="#fb7185" text-anchor="end">100<tspan font-size="17" fill="#6b6b76">%</tspan></text>
  <text x="1152" y="504" font-family="Noto Sans,DejaVu Sans,sans-serif" font-size="12" fill="#6b6b76" text-anchor="end">0.55 threshold</text>

  <g font-family="Noto Sans,DejaVu Sans,sans-serif" font-size="13.5">
    <text x="770" y="548" fill="#a1a1aa"><tspan fill="#fb7185" font-weight="700">+0.41</tspan>  account</text>
    <rect x="880" y="538" width="150" height="9" rx="4" fill="#fb7185" fill-opacity=".85"/>
    <text x="770" y="574" fill="#a1a1aa"><tspan fill="#34d399" font-weight="700">−0.19</tspan>  recharge</text>
    <rect x="880" y="564" width="70" height="9" rx="4" fill="#34d399" fill-opacity=".85"/>
  </g>
  <text x="770" y="600" font-family="Noto Sans,DejaVu Sans,sans-serif" font-size="11.5" fill="#6b6b76" letter-spacing="1.2">WHY THIS VERDICT · SHAP WORD IMPACT</text>

  <!-- footer metrics -->
  <g font-family="Noto Sans,DejaVu Sans,sans-serif">
    <g transform="translate(78 654)">
      <text x="0" y="0" font-size="30" font-weight="800" fill="#fafafa">97.54%</text>
      <text x="0" y="21" font-size="11.5" fill="#6b6b76" letter-spacing="1.3">TEST ACCURACY</text>
    </g>
    <line x1="196" y1="640" x2="196" y2="678" stroke="#ffffff" stroke-opacity=".12"/>
    <g transform="translate(226 654)">
      <text x="0" y="0" font-size="30" font-weight="800" fill="#fafafa">0.46%</text>
      <text x="0" y="21" font-size="11.5" fill="#6b6b76" letter-spacing="1.3">FALSE POSITIVES</text>
    </g>
    <line x1="392" y1="640" x2="392" y2="678" stroke="#ffffff" stroke-opacity=".12"/>
    <g transform="translate(422 654)">
      <text x="0" y="0" font-size="30" font-weight="800" fill="#fafafa">0.9845</text>
      <text x="0" y="21" font-size="11.5" fill="#6b6b76" letter-spacing="1.3">HINDI F1</text>
    </g>
    <line x1="580" y1="640" x2="580" y2="678" stroke="#ffffff" stroke-opacity=".12"/>
    <g transform="translate(610 654)">
      <text x="0" y="0" font-size="30" font-weight="800" fill="#fafafa">100</text>
      <text x="0" y="21" font-size="11.5" fill="#6b6b76" letter-spacing="1.3">LANGUAGES</text>
    </g>
  </g>
</svg>